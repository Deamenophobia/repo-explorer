<path d="M0 0L7 3.5L0 7" fill="#91a281"/></marker></defs>
<rect width="1000" height="410" rx="18" fill="#f8faf4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="43" font-size="11" letter-spacing="2" fill="#849774">
REPO EXPLORER / ENGINEERING NOTES</text>
<text x="40" y="80" font-size="25" fill="#243e2e">A question can finish; a review waits for a decision</text>
<text x="40" y="106" font-size="13" fill="#7b8b70">No evidence abstains. Invalid references or insufficient evidence stop at validation.</text>
