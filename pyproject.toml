[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-explorer"
version = "0.1.0"
description = "Repository knowledge and review workflows with inspectable evidence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1,<2", "langchain-text-splitters>=1,<2",
  "langsmith>=0.14,<1",
  "scikit-learn>=1.6,<2", "langchain-openai>=1,<2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1,<2"]
ollama = ["langchain-ollama>=1,<2"]
fastembed = ["fastembed==0.8.1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
hooks = ["pre-commit==4.6.2"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
